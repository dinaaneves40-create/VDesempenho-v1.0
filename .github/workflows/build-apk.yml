name: Gerar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Descompactar ValScreen
        run: |
          unzip -q ValScreen.zip -d projeto
          echo "Arquivos encontrados:"
          find projeto -maxdepth 3 -type f | head -100

      # O Android SDK atual precisa de Java 17
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK Android
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-21" "build-tools;21.1.0"

      # O projeto usa Gradle antigo, que funciona com Java 8
      - name: Configurar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Instalar Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Verificar Java e Gradle
        run: |
          java -version
          gradle --version

      - name: Compilar APK
        working-directory: projeto/ValScreen
        run: |
          gradle assembleRelease --no-daemon

      - name: Procurar APK
        run: |
          echo "APKs encontrados:"
          find projeto -type f -name "*.apk" -print

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VDesempenho-v1.0
          path: projeto/ValScreen/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
