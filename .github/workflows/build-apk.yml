name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # BAIXAR O PROJETO
      # ==========================================
      - name: Baixar projeto
        uses: actions/checkout@v4

      # ==========================================
      # DEPENDÊNCIAS PARA ANDROID ANTIGO
      # ==========================================
      - name: Instalar dependências
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo apt-get install -y \
            unzip \
            wget \
            libc6:i386 \
            libstdc++6:i386 \
            zlib1g:i386

      # ==========================================
      # JAVA 17
      # Necessário apenas para preparar o SDK
      # ==========================================
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # CONFIGURAR ANDROID SDK
      # ==========================================
      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      # ==========================================
      # INSTALAR SDK ANDROID 21
      # E BUILD TOOLS 23.0.3
      # ==========================================
      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-21" \
            "build-tools;23.0.3"

      # ==========================================
      # JAVA 8 PARA O PROJETO ANTIGO
      # ==========================================
      - name: Configurar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      # ==========================================
      # VERIFICAR JAVA
      # ==========================================
      - name: Verificar Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version

      # ==========================================
      # DESCOMPACTAR VALSCREEN
      # ==========================================
      - name: Descompactar ValScreen
        run: |
          rm -rf projeto
          mkdir -p projeto

          unzip -q ValScreen.zip -d projeto

          echo "Estrutura do projeto:"
          find projeto -maxdepth 4 -type f | head -100

      # ==========================================
      # INSTALAR GRADLE 2.14.1
      # ==========================================
      - name: Instalar Gradle 2.14.1
        run: |
          cd "$RUNNER_TEMP"

          wget -q \
            https://services.gradle.org/distributions/gradle-2.14.1-bin.zip

          rm -rf gradle-2.14.1

          unzip -q gradle-2.14.1-bin.zip

          echo "$RUNNER_TEMP/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      # ==========================================
      # DEFINIR BUILD TOOLS
      # ==========================================
      - name: Definir Android Build Tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "$ANDROID_HOME/build-tools/23.0.3" >> "$GITHUB_PATH"

          echo "sdk.dir=$ANDROID_HOME" > projeto/ValScreen/local.properties

      # ==========================================
      # VERIFICAR AMBIENTE
      # ==========================================
      - name: Verificar ambiente
        working-directory: projeto/ValScreen
        run: |
          echo "===== JAVA ====="
          java -version

          echo "===== GRADLE ====="
          gradle --version

          echo "===== AAPT ====="
          "$ANDROID_HOME/build-tools/23.0.3/aapt" version

          echo "===== SDK ====="
          ls "$ANDROID_HOME/platforms/android-21"

      # ==========================================
      # COMPILAR APK
      # =================================
