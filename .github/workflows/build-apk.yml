name: Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Instalar dependências
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            unzip \
            wget \
            libc6:i386 \
            libstdc++6:i386 \
            zlib1g:i386

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar SDK antigo
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-21" \
            "build-tools;21.1.2"

      - name: Extrair ValScreen
        run: |
          rm -rf projeto
          mkdir projeto
          unzip -q ValScreen.zip -d projeto

      - name: Configurar SDK do projeto
        run: |
          echo "sdk.dir=$ANDROID_HOME" > projeto/ValScreen/local.properties

      - name: Instalar Gradle 2.14.1
        run: |
          wget -q https://services.gradle.org/distributions/gradle-2.14.1-bin.zip
          unzip -q gradle-2.14.1-bin.zip
          echo "$PWD/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Verificar ambiente
        run: |
          java -version
          gradle --version

      - name: Compilar APK
        working-directory: projeto/ValScreen
        run: |
          gradle clean assembleRelease --no-daemon --stacktrace

      - name: Encontrar APK
        run: |
          mkdir -p apk-final

          APK=$(find projeto/ValScreen \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "APK não foi encontrado."
            exit 1
          fi

          cp "$APK" apk-final/VDesempenho-v1.0.apk

          ls -lh apk-final/VDesempenho-v1.0.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VDesempenho-v1.0
          path: apk-final/VDesempenho-v1.0.apk
          if-no-files-found: error
