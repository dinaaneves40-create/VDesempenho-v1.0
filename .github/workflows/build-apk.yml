name: Gerar APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:

      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Verificar Java
        run: |
          echo "JAVA_HOME=$JAVA_HOME"
          java -version
          javac -version

      - name: Configurar Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Instalar Android SDK
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-21" \
            "build-tools;23.0.3"

      - name: Verificar Android SDK
        run: |
          sdkmanager --list | head -80
          "$ANDROID_HOME/build-tools/23.0.3/aapt" version

      - name: Descompactar ValScreen
        run: |
          rm -rf projeto
          mkdir -p projeto

          unzip -q ValScreen.zip -d projeto

          echo "===== ESTRUTURA DO PROJETO ====="
          find projeto -maxdepth 4 -type f | head -100

      - name: Configurar local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > projeto/ValScreen/local.properties

          echo "===== local.properties ====="
          cat projeto/ValScreen/local.properties

      - name: Instalar Gradle 2.14.1
        run: |
          cd "$RUNNER_TEMP"

          wget -q \
            https://services.gradle.org/distributions/gradle-2.14.1-bin.zip

          rm -rf gradle-2.14.1

          unzip -q gradle-2.14.1-bin.zip

          echo "$RUNNER_TEMP/gradle-2.14.1/bin" >> "$GITHUB_PATH"

      - name: Verificar Gradle
        run: |
          gradle --version

      - name: Compilar APK
        working-directory: projeto/ValScreen
        run: |
          echo "===== INICIANDO COMPILAÇÃO ====="

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew clean assembleRelease --no-daemon
          else
            gradle clean assembleRelease --no-daemon
          fi

          echo "===== COMPILAÇÃO TERMINADA ====="

      - name: Procurar APK
        run: |
          echo "===== PROCURANDO APK ====="

          APK=$(find projeto/ValScreen \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERRO: APK não encontrado!"
            echo ""
            echo "Arquivos encontrados:"
            find projeto/ValScreen -type f | grep -E "\.apk$|build/outputs" || true
            exit 1
          fi

          echo "APK encontrado:"
          echo "$APK"

          mkdir -p apk-final

          cp "$APK" apk-final/VDesempenho-v1.0.apk

          echo ""
          echo "===== APK FINAL ====="
          ls -lh apk-final/VDesempenho-v1.0.apk

      - name: Verificar APK
        run: |
          if [ ! -f "apk-final/VDesempenho-v1.0.apk" ]; then
            echo "ERRO: arquivo APK não existe!"
            exit 1
          fi

          echo "APK confirmado:"
          file apk-final/VDesempenho-v1.0.apk
          ls -lh apk-final/VDesempenho-v1.0.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: VDesempenho-v1.0
          path: apk-final/VDesempenho-v1.0.apk
          if-no-files-found: error

      - name: Finalizado
        run: |
          echo "======================================"
          echo "       APK GERADO COM SUCESSO!"
          echo "======================================"
          echo ""
          echo "Arquivo:"
          ls -lh apk-final/VDesempenho-v1.0.apk
